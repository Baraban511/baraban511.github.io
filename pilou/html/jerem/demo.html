<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Démo | Codage AES</title>
        <link rel="stylesheet" type="text/css" href="./index.css" />
        <link
            rel="preload"
            href="https://links.barab.me/cdn/font/Mona-Sans.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="icon"
            href="https://links.barab.me/cdn/images/barab/gamer/logo.png"
            type="image/x-icon"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    </head>
    <body>
        <nav class="navbar">
            <div>
                <a href="./index.html">Introduction</a>
            </div>
            <div>
                <a href="./demo.html" class="active">Démonstration</a>
            </div>
        </nav>
        <p class="title">
            Démonstration de chiffrement ou déchiffrement de code AES
        </p>
        <div class="container">
            <div class="box">
                <p class="subtitle">Encodage</p>
                <input
                    type="text"
                    id="encodeInput"
                    placeholder="Entrez le texte à chiffrer"
                />
                <div class="relative">
                    <input
                        type="text"
                        id="encodeKey"
                        placeholder="Entrez la clé de chiffrement"
                    />

                    <button class="key-button" id="encodeToggleButton">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            id="encodeIcon"
                        >
                            <g
                                fill="none"
                                stroke="#000"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                            >
                                <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0-4 0" />
                                <path
                                    d="M21 12q-3.6 6-9 6t-9-6q3.6-6 9-6t9 6"
                                />
                            </g>
                        </svg>
                    </button>
                </div>
                <p class="subtitle">Résultat :</p>
                <p id="encodeOutput"></p>
            </div>
            <div class="box">
                <p class="subtitle">Décodage</p>
                <input
                    type="text"
                    id="decodeInput"
                    placeholder="Entrez le texte à déchiffrer"
                />
                <div class="relative">
                    <input
                        type="text"
                        id="decodeKey"
                        placeholder="Entrez la clé de déchiffrement"
                    />

                    <button class="key-button" id="decodeToggleButton">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            id="decodeIcon"
                        >
                            <g
                                fill="none"
                                stroke="#000"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                            >
                                <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0-4 0" />
                                <path
                                    d="M21 12q-3.6 6-9 6t-9-6q3.6-6 9-6t9 6"
                                />
                            </g>
                        </svg>
                    </button>
                </div>
                <p class="subtitle">Résultat :</p>
                <div id="decodeOutput" class="output"></div>
            </div>
        </div>
        <script src="./index.js"></script>
    </body>
</html>
